global:
   scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'my_test_appsrv'
    static_configs:
      - targets: ['my_test_appsrv:9100']
  - job_name: 'laptop_exporter'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels: 
          instance: 'JemLaptop'
          